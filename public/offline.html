<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="robots" content="noindex">
    <title>Sei offline — Hub Core</title>
    <link rel="icon" href="/pwa/icon-192.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5fb; color: #12122b; }
        .top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: #fff; border-bottom: 1px solid rgba(18,18,43,.09); font-weight: 800; }
        .top img { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(18,18,43,.09); }
        main { flex: 1; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
        .ico { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 30px; background: #eef0fb; display: grid; place-items: center; color: #4f46e5; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { margin: 0 auto; max-width: 300px; color: #667085; line-height: 1.45; }
        .bar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid rgba(18,18,43,.09); }
        button { width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: #6366f1; color: #fff; font: 800 1.05rem system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
    </style>
</head>
<body>
<div class="top"><img src="/pwa/icon-192.png" alt="">Hub Core</div>
<main>
    <div>
        <div class="ico" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16.1a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M3 3l18 18"/></svg>
        </div>
        <h1>Sei offline</h1>
        <p>Manca la connessione. Appena torna internet, riprova.</p>
    </div>
</main>
<div class="bar"><button type="button" onclick="location.reload()">↻ Riprova</button></div>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
